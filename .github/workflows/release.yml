name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json

run-name: Publish release from ${{ github.ref_name }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release-state.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve release version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release candidate: v${VERSION}."

      - name: Inspect release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v${VERSION} is already published; no release is required."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_SHA="$(git ls-remote origin "refs/tags/v${VERSION}" | awk '{print $1}')"
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "Tag v${VERSION} points to ${TAG_SHA}; expected ${GITHUB_SHA}." >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.release-state.outputs.publish == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic tests
        if: steps.release-state.outputs.publish == 'true'
        run: npm test

      - name: Check repository structure and release metadata
        if: steps.release-state.outputs.publish == 'true'
        run: npm run repo:check

      - name: Validate Case Library
        if: steps.release-state.outputs.publish == 'true'
        run: npm run case:validate

      - name: Smoke venture onboarding scaffold
        if: steps.release-state.outputs.publish == 'true'
        run: |
          npm run venture:new -- release-smoke "A B2B SaaS that helps small teams detect costly workflow anomalies before they become incidents"
          npm run venture:check -- release-smoke

      - name: Smoke eval input bridge
        if: steps.release-state.outputs.publish == 'true'
        run: npm run eval:new -- inventory-monitoring-saas release-smoke

  publish:
    name: Publish release
    needs: validate_release
    if: needs.validate_release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate_release.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Venture OS v${VERSION}" \
            --generate-notes \
            --fail-on-no-commits

      - name: Verify published tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate_release.outputs.version }}
        run: |
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --jq '.object.sha')"
          if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "Published tag points to ${TAG_SHA:-<missing>}; expected ${GITHUB_SHA}." >&2
            exit 1
          fi
          gh release view "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,url
